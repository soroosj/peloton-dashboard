<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peloton Workout Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:13px;background:#f5f5f3;color:#1a1a1a;min-height:100vh}
a{color:inherit}
:root{--blue:#378ADD;--coral:#D85A30;--teal:#1D9E75;--purple:#7F77DD;--gray:#888780;--border:#e0deda;--bg:#f5f5f3;--card:#fff;--text:#1a1a1a;--muted:#666;--hint:#999}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a1a;--card:#252525;--text:#e8e8e8;--muted:#aaa;--hint:#666;--border:#333}
  body{background:#1a1a1a;color:#e8e8e8}
}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;min-width:220px;background:var(--card);border-right:1px solid var(--border);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.main{flex:1;overflow-y:auto;padding:16px;}
.stats-row,.chart-card,.table-card{margin-bottom:14px}
h1{font-size:16px;font-weight:600;color:var(--text)}
.filter-group label.group-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--hint);display:block;margin-bottom:6px}
.filter-group{display:flex;flex-direction:column;gap:4px}
.check-label{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--muted);padding:2px 0}
.check-label:hover{color:var(--text)}
.check-label input{cursor:pointer;accent-color:var(--blue)}
select,input[type=date],input[type=text]{width:100%;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:var(--card);color:var(--text);outline:none}
select:focus,input:focus{border-color:var(--blue)}
.btn{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--muted);cursor:pointer;font-size:11px;width:100%;text-align:center}
.btn:hover{background:var(--bg);color:var(--text)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#2a73c0}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat-card{background:var(--card);border-radius:10px;padding:12px 14px;border:1px solid var(--border)}
.stat-card .lbl{font-size:11px;color:var(--hint);margin-bottom:3px}
.stat-card .val{font-size:20px;font-weight:600;color:var(--text);line-height:1.1}
.stat-card .sub{font-size:11px;color:var(--hint);margin-top:2px}
.chart-card{background:var(--card);border-radius:10px;padding:14px 16px;border:1px solid var(--border)}
.chart-card .chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.chart-card .chart-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint)}
.table-card{background:var(--card);border-radius:10px;border:1px solid var(--border);overflow:hidden}
.table-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--card)}
.table-header .count{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead th{padding:8px 10px;text-align:left;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--hint);border-bottom:1px solid var(--border);cursor:pointer;user-select:none;background:var(--card);position:sticky;top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
thead th:hover{color:var(--text)}
thead th.sorted{color:var(--blue)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--bg)}
tbody tr:last-child{border-bottom:none}
td{padding:7px 10px;font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.muted{color:var(--muted)}
.disc-badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:500}
.disc-Cycling{background:#deeef9;color:#1860a0}
.disc-Strength{background:#faecea;color:#9e3a1d}
.disc-Stretching{background:#d8f0e8;color:#0e5c40}
.disc-Meditation{background:#eceafb;color:#4a44a0}
.disc-Yoga{background:#fdf3e7;color:#8a5510}
.disc-Running{background:#e8f4e8;color:#2d6e2d}
.disc-Walking{background:#f0f0ef;color:#555}
.disc-Cardio{background:#fce8f0;color:#9e2060}
@media(prefers-color-scheme:dark){
.disc-Cycling{background:#1a3a55;color:#6ab0f0}
.disc-Strength{background:#4a1f10;color:#f09070}
.disc-Stretching{background:#0e3322;color:#5acca0}
.disc-Meditation{background:#2a2560;color:#b0a8f8}
.disc-Yoga{background:#3a2808;color:#e0a840}
.disc-Running{background:#102510;color:#80c880}
.disc-Walking{background:#252525;color:#aaa}
.disc-Cardio{background:#3a1025;color:#f080b0}
}
.watts-badge{background:#deeef9;color:#1860a0;padding:2px 7px;border-radius:4px;font-size:11px;font-weight:600}
@media(prefers-color-scheme:dark){.watts-badge{background:#1a3a55;color:#6ab0f0}}
.pagination{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--card)}
.page-btns{display:flex;gap:6px}
.page-btn{padding:4px 10px;border:1px solid var(--border);border-radius:5px;background:var(--card);color:var(--muted);cursor:pointer;font-size:12px}
.page-btn:hover{background:var(--bg);color:var(--text)}
.page-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.page-btn:disabled{opacity:.4;cursor:not-allowed}
.sort-arrow{margin-left:3px;font-size:10px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:4px}
.legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.filter-group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.filter-group-header .group-label{margin-bottom:0}
.sel-all{font-size:11px;color:var(--blue);cursor:pointer;user-select:none;white-space:nowrap}
.sel-all:hover{text-decoration:underline}
.sel-sep{font-size:11px;color:var(--hint);margin:0 2px}
</style>
</head>
<body>
<div class="app">
<div class="sidebar">
  <h1>🚴 Peloton</h1>
  <div class="filter-group">
    <label class="group-label">Search</label>
    <input type="text" id="search" placeholder="Title or instructor…">
  </div>
  <div class="filter-group">
    <label class="group-label">Date range</label>
    <input type="date" id="dateFrom" value="2021-07-01">
    <div style="height:4px"></div>
    <input type="date" id="dateTo" value="2026-06-07">
  </div>
  <div class="filter-group">
    <div class="filter-group-header">
      <label class="group-label">Discipline</label>
      <span><span class="sel-all" onclick="toggleAll('discFilters',true)">all</span><span class="sel-sep">·</span><span class="sel-all" onclick="toggleAll('discFilters',false)">none</span></span>
    </div>
    <div id="discFilters"></div>
  </div>
  <div class="filter-group">
    <div class="filter-group-header">
      <label class="group-label">Length (min)</label>
      <span><span class="sel-all" onclick="toggleAll('lengthFilters',true)">all</span><span class="sel-sep">·</span><span class="sel-all" onclick="toggleAll('lengthFilters',false)">none</span></span>
    </div>
    <div id="lengthFilters"></div>
  </div>
  <div class="filter-group">
    <label class="group-label">Instructor</label>
    <select id="instrFilter"><option value="">All instructors</option></select>
  </div>
  <button class="btn btn-primary" onclick="resetFilters()">Reset filters</button>
</div>

<div class="main">
  <div class="stats-row" id="statsRow"></div>
  <div class="chart-card">
    <div class="chart-header">
      <span class="chart-title">Monthly workouts</span>
      <div class="legend" id="chartLegend"></div>
    </div>
    <div style="position:relative;height:130px"><canvas id="mainChart" role="img" aria-label="Watts histogram"></canvas></div>
  </div>
  <div class="table-card">
    <div class="table-header">
      <span class="count" id="tableCount"></span>
      <select id="pageSizeSelect" style="width:auto;padding:4px 8px;font-size:12px">
        <option value="50">50 / page</option>
        <option value="100">100 / page</option>
        <option value="200">200 / page</option>
      </select>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead>
        <tr>
          <th style="width:55px">#</th>
          <th style="width:55px" onclick="setSort('pct')">Pct<span class="sort-arrow" id="sort-pct"></span></th>
          <th style="width:110px" onclick="setSort('date')">Date<span class="sort-arrow" id="sort-date"></span></th>
          <th style="width:100px" onclick="setSort('disc')">Discipline<span class="sort-arrow" id="sort-disc"></span></th>
          <th style="width:130px" onclick="setSort('instr')">Instructor<span class="sort-arrow" id="sort-instr"></span></th>
          <th style="width:55px" onclick="setSort('len')">Min<span class="sort-arrow" id="sort-len"></span></th>
          <th style="width:auto" onclick="setSort('title')">Title<span class="sort-arrow" id="sort-title"></span></th>
          <th style="width:65px" onclick="setSort('watts')">Watts<span class="sort-arrow" id="sort-watts"></span></th>
          <th style="width:65px" onclick="setSort('output')">Output<span class="sort-arrow" id="sort-output"></span></th>
          <th style="width:65px" onclick="setSort('dist')">km<span class="sort-arrow" id="sort-dist"></span></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    </div>
    <div class="pagination">
      <span id="pageInfo" style="font-size:12px;color:var(--muted)"></span>
      <div class="page-btns" id="pageBtns"></div>
    </div>
  </div>
</div>
</div>

const ROWS = RAW.rows;
const MAX_DATE = ROWS.reduce((max, r) => (r[0] > max ? r[0] : max), '0000-00-00');
const DISC_COLORS = {Cycling:'#378ADD',Strength:'#D85A30',Stretching:'#1D9E75',Meditation:'#7F77DD',Yoga:'#BA7517',Running:'#639922',Walking:'#888780',Cardio:'#D4537E'};
const F = {search:'',dateFrom:'2021-07-01',dateTo:MAX_DATE,discs:new Set(),lengths:new Set(),instr:''};

function init() {
  document.getElementById('dateTo').value = MAX_DATE;
  document.getElementById('dateTo').max = MAX_DATE;
  const discDiv = document.getElementById('discFilters');
  RAW.disciplines.forEach(d => {
    const checked = d === 'Cycling';
    const lbl = document.createElement('label');
    lbl.className = 'check-label';
    lbl.innerHTML = `<input type="checkbox" value="${d}" ${checked?'checked':''} onchange="filterChange()"> ${d}`;
    if (checked) F.discs.add(d);
    discDiv.appendChild(lbl);
  });
  const lenDiv = document.getElementById('lengthFilters');
  [5,10,15,20,30,45,60].forEach(l => {
    const checked = l === 30;
    const lbl = document.createElement('label');
    lbl.className = 'check-label';
    lbl.innerHTML = `<input type="checkbox" value="${l}" ${checked?'checked':''} onchange="filterChange()"> ${l} min`;
    if (checked) F.lengths.add(l);
    lenDiv.appendChild(lbl);
  });
  const instrEl = document.getElementById('instrFilter');
  RAW.instructors.forEach(i => { if(i) instrEl.innerHTML += `<option value="${i}">${i}</option>`; });

  document.getElementById('dateTo').addEventListener('change', e => { F.dateTo = e.target.value; filterChange(); });
  document.getElementById('instrFilter').addEventListener('change', e => { F.instr = e.target.value; filterChange(); });
  document.getElementById('pageSizeSelect').addEventListener('change', e => { pageSize = parseInt(e.target.value); page = 1; render(); });

  applyFilters();
}

function filterChange() {
  F.discs = new Set([...document.querySelectorAll('#discFilters input:checked')].map(el=>el.value));
  F.lengths = new Set([...document.querySelectorAll('#lengthFilters input:checked')].map(el=>parseInt(el.value)));
  page = 1;
  applyFilters();
}

function applyFilters() {
  filtered = ROWS.filter(r => {
    const [date,disc,instr,len,type,title,output,watts,res,cad,dist,cal,hr] = r;
    if (date < F.dateFrom || date > F.dateTo) return false;
    if (!F.discs.has(disc)) return false;
    if (len !== null && !F.lengths.has(len)) return false;
    if (F.instr && instr !== F.instr) return false;
    if (F.search && !(title && title.toLowerCase().includes(F.search)) && !(instr && instr.toLowerCase().includes(F.search))) return false;
    // Exclude unfinished cycling workouts
    if (disc === 'Cycling') {
      const kj = parseFloat(output) || 0;
      if (kj < 10) return false;
      if (len === 30 && kj < 130) return false;
    }
    return true;
  });
  sortAndRender();
}

function setSort(col) {
  if (col === 'pct') col = 'watts';
  if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = -1; }
  page = 1;
  sortAndRender();
}

function sortAndRender() {
  const idx = {date:0,disc:1,instr:2,len:3,type:4,title:5,output:6,watts:7,cal:11,dist:10};
  const i = idx[sortCol] ?? 0;
  filtered.sort((a,b) => {
    const av = a[i], bv = b[i];
    if (av === null && bv === null) return 0;
    if (av === null) return 1;
    if (bv === null) return -1;
    if (typeof av === 'string') return sortDir * av.localeCompare(bv);
    return sortDir * (av - bv);
  });
  render();
}

function render() {

  renderTable();

  const totalDist = filtered.reduce((s,r) => s + (r[10]||0), 0);
  const totalOut = filtered.reduce((s,r) => s + (r[6]||0), 0);
  const wattRows = filtered.filter(r => r[1]==='Cycling' && r[7] && r[3] >= 20);
  const avgWatts = wattRows.length ? Math.round(wattRows.reduce((s,r)=>s+(r[7]||0),0)/wattRows.length) : 0;
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="lbl">workouts</div><div class="val">${filtered.length.toLocaleString()}</div></div>
    <div class="stat-card"><div class="lbl">time</div><div class="val">${Math.round(totalMins/60)}<span style="font-size:13px;font-weight:400"> hrs</span></div></div>
    <div class="stat-card"><div class="lbl">calories</div><div class="val">${Math.round(totalCal/1000)}k</div></div>
    <div class="stat-card"><div class="lbl">distance</div><div class="val">${Math.round(totalDist).toLocaleString()}<span style="font-size:13px;font-weight:400"> km</span></div></div>
    <div class="stat-card"><div class="lbl">avg watts (≥20min)</div><div class="val">${avgWatts || '—'}</div></div>
  `;
}

function renderChart() {
  const wattsVals = filtered.map(r => r[7]).filter(w => w != null && w > 0);
  const isDark = matchMedia('(prefers-color-scheme: dark)').matches;
  const gc = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.06)';
  const tc = isDark ? 'rgba(255,255,255,0.4)' : 'rgba(0,0,0,0.4)';
  if (chartInstance) chartInstance.destroy();
  if (wattsVals.length === 0) {
    document.getElementById('chartLegend').innerHTML = '';
    return;
  }
  const binSize = 10;
  const minW = Math.floor(Math.min(...wattsVals) / binSize) * binSize;
  const maxW = Math.ceil(Math.max(...wattsVals) / binSize) * binSize;
  const bins = [];
  for (let b = minW; b < maxW; b += binSize) bins.push(b);
  const counts = bins.map(b => wattsVals.filter(w => w >= b && w < b + binSize).length);
  const labels = bins.map(b => b + '');
  chartInstance = new Chart(document.getElementById('mainChart'), {
    type: 'bar',
    data: { labels, datasets: [{ data: counts, backgroundColor: '#378ADD', borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { title: ctx => ctx[0].label + '–' + (parseInt(ctx[0].label)+binSize) + 'W', label: ctx => ctx.raw + ' workouts' } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: tc, font: { size: 10 }, autoSkip: true, maxTicksLimit: 15, maxRotation: 0 } },
        y: { grid: { color: gc }, ticks: { color: tc, font: { size: 10 } } }
      }
    }
  });
  document.getElementById('chartLegend').innerHTML = `<span style="color:var(--muted);font-size:11px">${wattsVals.length} rides with watts · ${Math.round(wattsVals.reduce((a,b)=>a+b,0)/wattsVals.length)}W avg</span>`;
}

function stripDuration(title) {
  if (!title) return title;
  return title.replace(/^\d+\s*min(?:\s+\d+\s*sec)?\s+/i, '');
}

function renderTable() {
  const start = (page-1)*pageSize, end = Math.min(start+pageSize, filtered.length);
  const rows = filtered.slice(start, end);
  document.getElementById('tableCount').textContent = `${filtered.length.toLocaleString()} workouts`;
  document.getElementById('pageInfo').textContent = `${start+1}–${end} of ${filtered.length.toLocaleString()}`;
  const wattsSorted = [...filtered].sort((a,b) => (b[7]||0) - (a[7]||0));
  const rankMap = new Map(wattsSorted.map((r,i) => [r, i+1]));
  const totalWatts = wattsSorted.length;
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.map(r => {
    const [date,disc,instr,len,type,title,output,watts,res,cad,dist,cal,hr] = r;
    const discClass = 'disc-badge disc-' + (disc||'').replace(/[^a-zA-Z]/g,'');
    const wattsCell = watts ? `<span class="watts-badge">${watts}</span>` : '<span class="muted">—</span>';
    const rank = watts ? rankMap.get(r) : null;
    const pct = rank ? Math.ceil(rank / totalWatts * 100) : null;
    return `<tr>
      <td class="muted" style="font-size:11px;color:var(--hint)">${rank||'—'}</td>
      <td class="muted" style="font-size:11px;color:var(--hint)">${pct ? pct+'%' : '—'}</td>
      <td>${date}</td>
      <td><span class="${discClass}">${disc||''}</span></td>
      <td class="muted">${instr||'—'}</td>
      <td>${len||'—'}</td>
      <td title="${title||''}">${stripDuration(title)||'—'}</td>
      <td>${wattsCell}</td>
      <td>${output||'—'}</td>
      <td class="muted">${dist || '—'}</td>
    </tr>`;
  }).join('');
  renderPagination();
}

function renderPagination() {
  const total = Math.ceil(filtered.length / pageSize);
  const btns = document.getElementById('pageBtns');
  let html = `<button class="page-btn" onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>`;
  const pages = [];
  if (total <= 7) { for(let i=1;i<=total;i++) pages.push(i); }
  else {
    pages.push(1);
    if (page > 3) pages.push('…');
    for(let i=Math.max(2,page-1);i<=Math.min(total-1,page+1);i++) pages.push(i);
    if (page < total-2) pages.push('…');
    pages.push(total);
  }
  pages.forEach(p => {
    if (p==='…') html += `<span style="padding:4px 6px;color:var(--hint)">…</span>`;
    else html += `<button class="page-btn ${p===page?'active':''}" onclick="goPage(${p})">${p}</button>`;
  });
  html += `<button class="page-btn" onclick="goPage(${page+1})" ${page===total?'disabled':''}>›</button>`;
  btns.innerHTML = html;
}

function goPage(p) {
  const total = Math.ceil(filtered.length / pageSize);
  if (p < 1 || p > total) return;
  page = p;
  renderTable();
  document.querySelector('.table-card').scrollIntoView({behavior:'smooth',block:'start'});
}

function updateSortArrows() {
  document.querySelectorAll('.sort-arrow').forEach(el => el.textContent = '');
  const el = document.getElementById('sort-'+sortCol);
  if (el) el.textContent = sortDir === 1 ? ' ↑' : ' ↓';
  document.querySelectorAll('thead th').forEach(th => th.classList.remove('sorted'));
  const cols = {date:0,disc:1,instr:2,len:3,type:4,title:5,output:6,watts:7,cal:11,dist:10};
  // mark sorted header
}

function toggleAll(groupId, checked) {
  document.querySelectorAll('#'+groupId+' input').forEach(el => { el.checked = checked; });
  filterChange();
}

function resetFilters() {
  document.getElementById('search').value = ''; F.search = '';
  document.getElementById('dateFrom').value = '2021-07-01'; F.dateFrom = '2021-07-01';
  document.getElementById('dateTo').value = MAX_DATE; F.dateTo = MAX_DATE;
  document.querySelectorAll('#discFilters input').forEach(el => { el.checked = true; F.discs.add(el.value); });
  document.querySelectorAll('#lengthFilters input').forEach(el => { el.checked = true; F.lengths.add(parseInt(el.value)); });
  document.getElementById('instrFilter').value = ''; F.instr = '';
  page = 1; sortCol = 'date'; sortDir = -1;
  applyFilters();
}

init();
</script>
</body>
</html>
